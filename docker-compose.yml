services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
    command:
      - /bin/sh
      - -c
      - |
        cat > /tmp/mosquitto.conf <<'EOF'
        listener 1883
        allow_anonymous true
        persistence true
        persistence_location /mosquitto/data/
        log_dest stdout
        EOF
        exec mosquitto -c /tmp/mosquitto.conf
    volumes:
      - mosquitto_data:/mosquitto/data

  app:
    build: ./app
    container_name: mqtt-worker
    depends_on:
      - mosquitto
    ports:
      - "80:80"
      - "9090:9090"
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      HTTP_PORT: "80"
      WS_PORT: "9090"
      CLOUD_INGEST_URL: ${CLOUD_INGEST_URL:-https://greact.drll.cloud/api/ingest}

volumes:
  mosquitto_data:
