services:
  mosquitto:
    build: ./mosquitto
    container_name: mosquitto
    ports:
      - "1883:1883" # external MQTT port for receiving data
    volumes:
      - mosquitto_data:/mosquitto/data
    networks:
      - default

  app:
    build: ./app
    container_name: mqtt-worker
    depends_on:
      - mosquitto
    expose:
      - 80 
      - 9090 
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      HTTP_PORT: 80 # http port for video previewing page
      WS_PORT: 9090 # WebSocket port for video streaming
      CLOUD_INGEST_URL: ${CLOUD_INGEST_URL}
      CLOUD_INGEST_API_KEY: ${CLOUD_INGEST_API_KEY}
      DEMO_CLOUD_INGEST_URL: ${DEMO_CLOUD_INGEST_URL}
      ARCHIVE_BUCKET_SECONDS: ${ARCHIVE_BUCKET_SECONDS}
    volumes:
      - ./video-archive:/archive
    networks:
      - default
      - proxy

volumes:
  mosquitto_data:

networks:
  proxy:
    external: true
