services:
  mosquitto:
    build: ./mosquitto
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - mosquitto_data:/mosquitto/data

  app:
    build: ./app
    container_name: mqtt-worker
    depends_on:
      - mosquitto
    ports:
      - "80:80"
      - "9090:9090"
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      HTTP_PORT: "80"
      WS_PORT: "9090"
      CLOUD_INGEST_URL: ${CLOUD_INGEST_URL:-https://demo.backend.drill.greact.ru/ingest}

volumes:
  mosquitto_data:
